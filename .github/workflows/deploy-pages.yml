name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ранее здесь был шаг «Inject Worker URL into config.js», который
      # перезаписывал js/config.js значением из repository variable
      # vars.WORKER_URL. Это удобно, пока бэкенд один. После переезда на
      # Timeweb URL стал жить прямо в репозитории (см. js/config.js),
      # а variable-инъекция начала конфликтовать с ручными правками.
      # Если снова понадобится несколько environments — заведите
      # отдельные config.*.js и копируйте нужный на build-этапе.

      - name: Build site (copy static files)
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='worker' \
            --exclude='serve.ps1' \
            --exclude='.claude' \
            --exclude='README.md' \
            ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
