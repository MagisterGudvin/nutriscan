name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Worker URL into config.js
        if: ${{ vars.WORKER_URL != '' }}
        run: |
          escaped='${{ vars.WORKER_URL }}'
          sed -i "s|WORKER_URL: '[^']*'|WORKER_URL: '${escaped}'|" js/config.js
          echo "--- js/config.js after injection ---"
          cat js/config.js

      - name: Build site (copy static files)
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='worker' \
            --exclude='serve.ps1' \
            --exclude='.claude' \
            --exclude='README.md' \
            ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
